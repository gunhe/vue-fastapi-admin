services:
  openresty:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9080:80"
    cpus: "1.0"
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9999:9999"
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g